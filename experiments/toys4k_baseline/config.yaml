# Toys4k Aligned Evaluation Configuration
# =========================================

# Dataset
dataset:
  name: toys4k
  root: /mnt/workspace/kuno/distillation/datasets/Toys4k
  manifest: /mnt/workspace/kuno/distillation/datasets/Toys4k/compat/subset.csv
  # Subset control: set max_samples to limit, or provide sample_ids_file
  max_samples: null        # e.g. 20
  sample_ids_file: null    # e.g. /path/to/ids.txt (one id per line)
  category_filter: null    # e.g. [car, chair]

# Models (4-way comparison, 1 model per GPU)
models:
  - name: trellis
    version: "1.0"
    predictions_root: /mnt/workspace/kuno/distillation/results/toys4k/predictions/trellis/default
    mesh_filename: mesh_raw.obj
  - name: trellis2
    version: "2.0"
    predictions_root: /mnt/workspace/kuno/distillation/results/toys4k/predictions/trellis2/default
    mesh_filename: mesh_raw.obj
  - name: hunyuan3d
    version: "2.0"
    predictions_root: /mnt/workspace/kuno/distillation/results/toys4k/predictions/hunyuan3d/default
    mesh_filename: mesh_raw.obj
  - name: hunyuan3d21
    version: "2.1"
    predictions_root: /mnt/workspace/kuno/distillation/results/toys4k/predictions/hunyuan3d21/default
    mesh_filename: mesh_raw.obj

# Seeds (expand to [0,1,2] for multi-seed runs)
seeds: [42]

# Output
output_root: /mnt/workspace/kuno/distillation/results/toys4k

# Normalization
normalization:
  # GT canonical: center at origin, scale so max point norm = 1
  gt_method: unit_sphere  # center + max_norm=1
  # Pred pre-alignment: center + unit_sphere before ICP
  pred_method: unit_sphere

# Mesh cleaning
cleaning:
  remove_nan: true
  remove_inf: true
  remove_degenerate_faces: true
  remove_unreferenced_vertices: true
  remove_tiny_components: true
  tiny_component_threshold: 0.01  # fraction of total faces; shared across all models

# Point sampling
sampling:
  alignment_points: 100000   # dense cloud for ICP
  eval_points: 16384         # cloud for metric computation

# Alignment (Track A)
alignment:
  track_a:
    method: similarity_icp  # rotation + translation + uniform scale
    initial_rotations: 24   # cube symmetry group
    icp_max_iterations: 100
    allow_reflection: false
    allow_nonuniform_scale: false
  track_b:
    method: scale_only  # center + uniform scale, no rotation alignment
    allow_rotation: false

# Metrics
metrics:
  chamfer_distance:
    variant: L2_squared  # mean of squared L2 distances, bidirectional
  f_score:
    thresholds: [0.01, 0.02]
  hausdorff: true
  mesh_quality_stats: true
  bootstrap_ci:
    enabled: true
    n_bootstrap: 1000
    confidence: 0.95

# Execution
execution:
  skip_existing: true
  continue_on_failure: true
  log_level: INFO
