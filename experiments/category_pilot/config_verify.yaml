dataset:
  name: toys4k
  root: /mnt/workspace/kuno/distillation/datasets/Toys4k
  manifest: /mnt/workspace/kuno/distillation/experiments/category_pilot/manifest_verify.csv
  max_samples: null
  sample_ids_file: null
  category_filter: null

models:
  - name: trellis2
    version: "2.0"
    predictions_root: /mnt/workspace/kuno/distillation/results/category_pilot_verify/predictions/trellis2
    mesh_filename: mesh_raw.obj
  - name: hunyuan3d21
    version: "2.1"
    predictions_root: /mnt/workspace/kuno/distillation/results/category_pilot_verify/predictions/hunyuan3d21
    mesh_filename: mesh_raw.obj

seeds: [42]
output_root: /mnt/workspace/kuno/distillation/results/category_pilot_verify

normalization:
  gt_method: unit_sphere
  pred_method: unit_sphere

cleaning:
  remove_nan: true
  remove_inf: true
  remove_degenerate_faces: true
  remove_unreferenced_vertices: true
  remove_tiny_components: true
  tiny_component_threshold: 0.01

sampling:
  alignment_points: 100000
  eval_points: 16384

alignment:
  track_a:
    method: similarity_icp
    initial_rotations: 24
    icp_max_iterations: 100
    allow_reflection: false
    allow_nonuniform_scale: false
  track_b:
    method: scale_only
    allow_rotation: false

metrics:
  chamfer_distance:
    variant: L2_squared
  f_score:
    thresholds: [0.01, 0.02]
  hausdorff: true
  mesh_quality_stats: true
  bootstrap_ci:
    enabled: true
    n_bootstrap: 1000
    confidence: 0.95

execution:
  skip_existing: true
  continue_on_failure: true
  log_level: INFO
