# Experiment: Distillation Profiling + Evaluation (unified)
# ========================================================
# 4 models: 2 teachers + 2 distilled. N=48 samples.
# Block-level wall-clock profiling + mesh saving + geometry/FD evaluation.

dataset:
  name: Toys4k
  root: /mnt/workspace/kuno/distillation/datasets/Toys4k
  manifest: /mnt/workspace/kuno/distillation/experiments/inference_profiling/manifest.csv
  max_samples: null
  sample_ids_file: null
  category_filter: null

models:
  - name: trellis
    version: "1.0"
    description: "TRELLIS v1 teacher (25-step)"
    predictions_root: /mnt/workspace/kuno/distillation/results/distill_profiling/predictions/trellis/default
    mesh_filename: mesh_raw.obj
    inference_params:
      ss_steps: 25
      slat_steps: 25
      ss_cfg: 5.0
      slat_cfg: 5.0

  - name: mdt_dist
    version: "1.0-distilled"
    description: "TRELLIS v1 + MDT-dist (2-step)"
    predictions_root: /mnt/workspace/kuno/distillation/results/distill_profiling/predictions/mdt_dist/default
    mesh_filename: mesh_raw.obj
    inference_params:
      ss_steps: 2
      slat_steps: 2
      ss_cfg: 5.0
      slat_cfg: 1.0
      ss_cfg_interval: [0.5, 1.0]
      slat_cfg_interval: [0.5, 1.0]
      rescale_t: 1.0
      ckpts_dir: /mnt/workspace/kuno/distillation/models/mdt_dist/ckpts

  - name: hunyuan3d
    version: "2.0"
    description: "Hunyuan3D-2.0 teacher (50-step, default)"
    predictions_root: /mnt/workspace/kuno/distillation/results/distill_profiling/predictions/hunyuan3d/default
    mesh_filename: mesh_raw.obj
    inference_params:
      num_inference_steps: 50
      guidance_scale: 5.0
      octree_resolution: 384
      num_chunks: 8000

  - name: flashvdm
    version: "2.0-turbo"
    description: "Hunyuan3D-2.0 turbo DiT + FlashVDM (5-step)"
    predictions_root: /mnt/workspace/kuno/distillation/results/distill_profiling/predictions/flashvdm/default
    mesh_filename: mesh_raw.obj
    inference_params:
      num_inference_steps: 5
      octree_resolution: 384
      num_chunks: 8000

seeds: [42]

output_root: /mnt/workspace/kuno/distillation/results/distill_profiling

# Normalization
normalization:
  gt_method: unit_sphere
  pred_method: unit_sphere

# Mesh cleaning
cleaning:
  remove_nan: true
  remove_inf: true
  remove_degenerate_faces: true
  remove_unreferenced_vertices: true
  remove_tiny_components: true
  tiny_component_threshold: 0.01

# Point sampling
sampling:
  alignment_points: 100000
  eval_points: 16384

# Alignment
alignment:
  track_a:
    method: similarity_icp
    initial_rotations: 24
    icp_max_iterations: 100
    allow_reflection: false
    allow_nonuniform_scale: false
  track_b:
    method: scale_only
    allow_rotation: false

# Metrics
metrics:
  chamfer_distance:
    variant: L2_squared
  f_score:
    thresholds: [0.01, 0.02]
  hausdorff: true
  mesh_quality_stats: true
  bootstrap_ci:
    enabled: true
    n_bootstrap: 1000
    confidence: 0.95
  frechet_distance:
    enabled: true
    models: [inception_v3, dinov2]
    multiview:
      azimuths: [0, 90, 180, 270]
      elevation: 30
      resolution: 512

# Execution
execution:
  skip_existing: true
  continue_on_failure: true
  log_level: INFO
