# Experiment: Multi-seed Inference Profiling + Eval (3 seeds)
# ==============================================================================
# Extends inference_profiling_full (v2) with seeds [0, 1, 2] for variance analysis.
# Default predictions_root points to seed_0; gen_seed_config.py patches per seed.

dataset:
  name: Toys4k
  root: /mnt/workspace/kuno/distillation/datasets/Toys4k
  manifest: /mnt/workspace/kuno/distillation/experiments/inference_profiling_seeds3/manifest.csv
  max_samples: null
  sample_ids_file: null
  category_filter: null

models:
  - name: trellis2
    version: "2.0"
    predictions_root: /mnt/workspace/kuno/distillation/results/inference_profiling_seeds3/predictions/trellis2/seed_0
    mesh_filename: mesh_raw.obj
    inference_params:
      pipeline_type: "1024_cascade"
  - name: hunyuan3d21
    version: "2.1"
    predictions_root: /mnt/workspace/kuno/distillation/results/inference_profiling_seeds3/predictions/hunyuan3d21/seed_0
    mesh_filename: mesh_raw.obj
    inference_params:
      num_inference_steps: 50
      guidance_scale: 5.0
      octree_resolution: 384

seeds: [0, 1, 2]

output_root: /mnt/workspace/kuno/distillation/results/inference_profiling_seeds3/eval_seed_0

# Normalization
normalization:
  gt_method: unit_sphere
  pred_method: unit_sphere

# Mesh cleaning
cleaning:
  remove_nan: true
  remove_inf: true
  remove_degenerate_faces: true
  remove_unreferenced_vertices: true
  remove_tiny_components: true
  tiny_component_threshold: 0.01

# Point sampling
sampling:
  alignment_points: 100000
  eval_points: 16384

# Alignment (Track A)
alignment:
  track_a:
    method: similarity_icp
    initial_rotations: 24
    icp_max_iterations: 100
    allow_reflection: false
    allow_nonuniform_scale: false
  track_b:
    method: scale_only
    allow_rotation: false

# Metrics
metrics:
  chamfer_distance:
    variant: L2_squared
  f_score:
    thresholds: [0.01, 0.02]
  hausdorff: true
  mesh_quality_stats: true
  bootstrap_ci:
    enabled: true
    n_bootstrap: 1000
    confidence: 0.95

# Execution
execution:
  skip_existing: true
  continue_on_failure: true
  log_level: INFO
