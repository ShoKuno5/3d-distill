dataset:
  name: trellis500k_hssd_525
  root: /inspire/qb-ilm/project/qproject-assement/zhangkaipeng-24043/sk5/data/trellis500k
  manifest: /inspire/qb-ilm/project/qproject-assement/zhangkaipeng-24043/sk5/repos/3d-distill/distill_methods/manifests/525_hssd/train.csv
  test_manifest: /inspire/qb-ilm/project/qproject-assement/zhangkaipeng-24043/sk5/repos/3d-distill/distill_methods/manifests/toys4k_eval_105/test.csv
  max_samples: null
  sample_ids_file: null
  category_filter: null
training:
  training_data_dir: /inspire/qb-ilm/project/qproject-assement/zhangkaipeng-24043/sk5/scratch/distill_methods/525_hssd/training_data
  batch_size: 1
  num_workers: 4
  seed: 42
  bf16: true
  gradient_clip: 1.0
  log_interval: 1
  save_interval: 100
  total_steps: 5
  optimizer:
    type: AdamW
    lr: 1.0e-05
    weight_decay: 0.01
  model:
    pretrained: tencent/Hunyuan3D-2.1
    z_scale_factor: 1.0
    lora:
      rank: 64
      alpha: 64
      target_modules:
      - to_q
      - to_k
      - to_v
      - to_out.0
    ema:
      decay: 0.999
      use_num_updates: true
  methods:
    pd:
      stages:
      - - 50
        - 25
      - - 25
        - 12
      - - 12
        - 6
      steps_per_stage: 5000
    cd:
      num_timesteps: 50
    dmd1:
      lambda_reg: 1.0
      pairs_dir: /inspire/qb-ilm/project/qproject-assement/zhangkaipeng-24043/sk5/scratch/distill_methods/525_hssd/dmd1_pairs
      num_pairs: 20000
    dmd2:
      lr_d: 5.0e-05
      lambda_gan: 0.1
      d_update_ratio: 5
      replay_buffer_size: 32
      replay_warmup: 4
    sid:
      lsg_teacher_scale: 11.25
      lsg_fake_scale: 0.0
      grad_norm_type: adaptive
  cfg:
    guidance_scale: 7.5
output_root: /inspire/qb-ilm/project/qproject-assement/zhangkaipeng-24043/sk5/scratch/qzcli_smoke
models:
- name: teacher_50step
  version: '2.1'
  description: Hunyuan3D-2.1 teacher (50-step)
  mesh_filename: mesh_raw.obj
  inference_params:
    num_inference_steps: 50
    guidance_scale: 7.5
- name: pd_6step
  method: pd
  description: Progressive Distillation (6-step)
  mesh_filename: mesh_raw.obj
  inference_params:
    num_inference_steps: 6
    guidance_scale: 1.0
- name: cd_4step
  method: cd
  description: Consistency Distillation (4-step)
  mesh_filename: mesh_raw.obj
  inference_params:
    num_inference_steps: 4
    guidance_scale: 1.0
- name: dmd1_1step
  method: dmd1
  description: DMD1 (1-step)
  mesh_filename: mesh_raw.obj
  inference_params:
    num_inference_steps: 1
    guidance_scale: 1.0
- name: dmd2_1step
  method: dmd2
  description: DMD2 (1-step)
  mesh_filename: mesh_raw.obj
  inference_params:
    num_inference_steps: 1
    guidance_scale: 1.0
normalization:
  gt_method: unit_sphere
  pred_method: unit_sphere
cleaning:
  remove_nan: true
  remove_inf: true
  remove_degenerate_faces: true
  remove_unreferenced_vertices: true
  remove_tiny_components: true
  tiny_component_threshold: 0.01
sampling:
  alignment_points: 100000
  eval_points: 16384
alignment:
  track_a:
    method: similarity_icp
    initial_rotations: 24
    icp_max_iterations: 100
    allow_reflection: false
    allow_nonuniform_scale: false
  track_b:
    method: scale_only
    allow_rotation: false
metrics:
  chamfer_distance:
    variant: L2_squared
  f_score:
    thresholds:
    - 0.01
    - 0.02
  hausdorff: true
  mesh_quality_stats: true
  bootstrap_ci:
    enabled: true
    n_bootstrap: 1000
    confidence: 0.95
  frechet_distance:
    enabled: true
    models:
    - inception_v3
    - dinov2
    multiview:
      azimuths:
      - 0
      - 90
      - 180
      - 270
      elevation: 30
      resolution: 512
execution:
  skip_existing: true
  continue_on_failure: true
  log_level: INFO
