# Distill Methods Comparison: 4 distillation methods for Hunyuan3D-2.1
# =====================================================================
# PD, CD, DMD1, DMD2 trained on Toys4k, evaluated against teacher + FlashVDM.
#
# Usage:
#   bash distill_methods/run.sh
#   bash distill_methods/run.sh --skip-training --max-samples 5

# Dataset
dataset:
  name: toys4k
  root: /mnt/workspace/kuno/distillation/datasets/Toys4k
  manifest: /mnt/workspace/kuno/distillation/distill_methods/manifest.csv
  max_samples: null
  sample_ids_file: null
  category_filter: null

# Training
training:
  training_data_dir: /mnt/workspace/kuno/distillation/results/distill_methods/training_data
  batch_size: 4
  num_workers: 4
  seed: 42
  bf16: true
  gradient_clip: 1.0
  log_interval: 50
  save_interval: 1000

  model:
    pretrained: tencent/Hunyuan3D-2.1
    z_scale_factor: 1.0
    lora:
      rank: 64
      alpha: 64
      target_modules: [to_q, to_k, to_v, to_out.0]
    ema:
      decay: 0.999
      use_num_updates: true

  methods:
    pd:
      stages: [[50, 25], [25, 12], [12, 6]]
      steps_per_stage: 5000
      lr: 1.0e-5
    cd:
      total_steps: 20000
      lr: 1.0e-5
      num_timesteps: 50
    dmd1:
      total_steps: 20000
      lr: 1.0e-5
      lambda_reg: 1.0
      pairs_dir: /mnt/workspace/kuno/distillation/results/distill_methods/dmd1_pairs
      num_pairs: 20000
    dmd2:
      total_steps: 20000
      lr_g: 1.0e-5
      lr_d: 5.0e-5
      lambda_gan: 0.1
      d_update_ratio: 5
      replay_buffer_size: 1024
      replay_warmup: 128

  cfg:
    guidance_scale: 7.5

# Models to evaluate (teacher + distilled variants)
models:
  - name: teacher_50step
    version: "2.1"
    description: "Hunyuan3D-2.1 teacher (50-step)"
    predictions_root: /mnt/workspace/kuno/distillation/results/distill_methods/predictions/teacher_50step/default
    mesh_filename: mesh_raw.obj
    inference_params:
      num_inference_steps: 50
      guidance_scale: 5.0
      octree_resolution: 384

  - name: flashvdm
    version: "2.1-turbo"
    description: "Hunyuan3D-2.1 turbo DiT + FlashVDM (5-step)"
    predictions_root: /mnt/workspace/kuno/distillation/results/distill_methods/predictions/flashvdm/default
    mesh_filename: mesh_raw.obj
    inference_params:
      num_inference_steps: 5
      octree_resolution: 380
      num_chunks: 200000

  - name: pd_6step
    version: "2.1-pd"
    description: "PD distilled (6-step)"
    predictions_root: /mnt/workspace/kuno/distillation/results/distill_methods/predictions/pd_6step/default
    mesh_filename: mesh_raw.obj
    inference_params:
      num_inference_steps: 6
      guidance_scale: 1.0
      octree_resolution: 384
      lora_path: /mnt/workspace/kuno/distillation/results/distill_methods/checkpoints/pd/final

  - name: cd_4step
    version: "2.1-cd"
    description: "CD distilled (4-step)"
    predictions_root: /mnt/workspace/kuno/distillation/results/distill_methods/predictions/cd_4step/default
    mesh_filename: mesh_raw.obj
    inference_params:
      num_inference_steps: 4
      guidance_scale: 1.0
      octree_resolution: 384
      lora_path: /mnt/workspace/kuno/distillation/results/distill_methods/checkpoints/cd/final

  - name: dmd1_1step
    version: "2.1-dmd1"
    description: "DMD1 distilled (1-step)"
    predictions_root: /mnt/workspace/kuno/distillation/results/distill_methods/predictions/dmd1_1step/default
    mesh_filename: mesh_raw.obj
    inference_params:
      num_inference_steps: 1
      guidance_scale: 1.0
      octree_resolution: 384
      lora_path: /mnt/workspace/kuno/distillation/results/distill_methods/checkpoints/dmd1/final

  - name: dmd2_1step
    version: "2.1-dmd2"
    description: "DMD2 distilled (1-step)"
    predictions_root: /mnt/workspace/kuno/distillation/results/distill_methods/predictions/dmd2_1step/default
    mesh_filename: mesh_raw.obj
    inference_params:
      num_inference_steps: 1
      guidance_scale: 1.0
      octree_resolution: 384
      lora_path: /mnt/workspace/kuno/distillation/results/distill_methods/checkpoints/dmd2/final

# Seeds
seeds: [42]

# Output
output_root: /mnt/workspace/kuno/distillation/results/distill_methods

# Normalization
normalization:
  gt_method: unit_sphere
  pred_method: unit_sphere

# Mesh cleaning
cleaning:
  remove_nan: true
  remove_inf: true
  remove_degenerate_faces: true
  remove_unreferenced_vertices: true
  remove_tiny_components: true
  tiny_component_threshold: 0.01

# Point sampling
sampling:
  alignment_points: 100000
  eval_points: 16384

# Alignment
alignment:
  track_a:
    method: similarity_icp
    initial_rotations: 24
    icp_max_iterations: 100
    allow_reflection: false
    allow_nonuniform_scale: false
  track_b:
    method: scale_only
    allow_rotation: false

# Metrics
metrics:
  chamfer_distance:
    variant: L2_squared
  f_score:
    thresholds: [0.01, 0.02]
  hausdorff: true
  mesh_quality_stats: true
  bootstrap_ci:
    enabled: true
    n_bootstrap: 1000
    confidence: 0.95
  frechet_distance:
    enabled: true
    models: [inception_v3, dinov2]
    multiview:
      azimuths: [0, 90, 180, 270]
      elevation: 30
      resolution: 512

# Execution
execution:
  skip_existing: true
  continue_on_failure: true
  log_level: INFO
